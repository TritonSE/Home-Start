name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        env:
          NEXT_PUBLIC_FIREBASE: ${{ secrets.NEXT_PUBLIC_FIREBASE }}
        run: |
          if [ -z "$NEXT_PUBLIC_FIREBASE" ]; then
            echo "NEXT_PUBLIC_FIREBASE is not set."
            exit 1
          fi
          cd frontend
          cat > .env <<EOF
          NEXT_PUBLIC_FIREBASE=$NEXT_PUBLIC_FIREBASE
          NEXT_PUBLIC_API_URL=/api
          EOF
          npm ci 
          npm run build
      - name: Install backend dependencies
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_PRODUCTION }}
          FIREBASE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKEND }}
        run: |
          cd backend
          touch .env
          echo "DATABASE_URL=$MONGO_URL" >> .env
          echo "BACKEND_FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE" >> .env
          npm ci
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_START }}
          channelId: live
          projectId: home-start-80e0a
          force: true
