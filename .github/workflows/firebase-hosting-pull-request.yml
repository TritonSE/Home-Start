name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        env:
          NEXT_PUBLIC_FIREBASE: ${{ secrets.NEXT_PUBLIC_FIREBASE }}
        run: |
          if [ -z "$NEXT_PUBLIC_FIREBASE" ]; then
            echo "NEXT_PUBLIC_FIREBASE is not set."
            exit 1
          fi
          cd frontend
          cat > .env <<EOF
          NEXT_PUBLIC_FIREBASE='$NEXT_PUBLIC_FIREBASE'
          NEXT_PUBLIC_API_URL=/api
          EOF
          npm ci 
          npm run build
      - name: Install backend dependencies
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          FIREBASE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKEND }}
        run: |
          cd backend
          touch .env
          echo "DATABASE_URL=$MONGO_URL" >> .env
          echo "BACKEND_FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE" >> .env
          npm ci
          npm run lint-check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          BACKEND_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_START }}
          projectId: home-start-80e0a
